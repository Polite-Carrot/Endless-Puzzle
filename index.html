<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Endless Quiz</title>
<link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- ─────────────── question ─────────────── -->
  <section id="screen-quiz" class="screen is-active">
    <header class="topbar">
      <button id="back" class="btn btn--ghost" type="button">&larr; Menu</button>
      <div class="topbar__title">
        <h2 id="q-title">Rung 1</h2>
        <span id="q-sub">Climb</span>
      </div>
      <div class="topbar__stats">
        <span class="stat stat--coins"><b><i class="coin" aria-hidden="true"></i><span id="stat-coins">0</span></b><small>coins</small></span>
        <span class="stat"><b id="stat-streak">0</b><small>streak</small></span>
      </div>
    </header>

    <div class="ladder" id="ladder" role="img" aria-label="Ladder"></div>

    <article class="question" id="question">
      <div class="question__tags">
        <span class="tag tag--cat" id="q-cat"><i id="q-cat-icon" aria-hidden="true"></i><span id="q-cat-name"></span></span>
        <span class="tag tag--diff" id="q-diff"></span>
      </div>
      <h3 class="question__text" id="q-text"></h3>
    </article>

    <div class="lifelines">
      <span class="lifelines__note" id="ladder-note"></span>
      <button id="fifty" class="btn lifeline" type="button">
        <span class="lifeline__name">50/50</span>
        <span class="lifeline__cost"><i class="coin" aria-hidden="true"></i><span id="fifty-cost">25</span></span>
      </button>
    </div>

    <ol class="answers" id="answers"></ol>

    <div class="result" id="result" hidden>
      <div class="result__head">
        <span class="result__mark" id="result-mark" aria-hidden="true"></span>
        <h4 class="result__title" id="result-title"></h4>
      </div>
      <p class="result__why" id="result-why"></p>
      <button id="next" class="btn btn--primary btn--wide" type="button">Next question &rsaquo;</button>
    </div>
  </section>

</div>

<script src="js/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
